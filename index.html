<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loaf Apps</title>
<meta name="robots" content="index, follow">
<style>
:root {
  --felt: #1E5C48; --deep: #164437; --paper: #FBF7EF;
  --accent: #F0C674; --soft: rgba(251,247,239,0.74);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--felt); color: var(--paper);
  font: 17px/1.65 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.4rem 5rem; }
h1 { font-size: 2.1rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 .4rem; }
h2 { font-size: 1.3rem; margin: 2.6rem 0 .6rem; color: var(--accent); }
h3 { font-size: 1.05rem; margin: 1.8rem 0 .4rem; }
p, li { color: var(--soft); }
strong { color: var(--paper); }
em { color: var(--soft); font-style: normal; opacity: .8; }
a { color: var(--accent); }
hr { border: 0; border-top: 1px solid rgba(251,247,239,.16); margin: 2.5rem 0; }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .95rem; }
th, td {
  text-align: left; padding: .55rem .7rem; vertical-align: top;
  border-bottom: 1px solid rgba(251,247,239,.14);
}
th { color: var(--accent); font-size: .78rem; text-transform: uppercase;
     letter-spacing: .06em; }
td { color: var(--soft); }
/* A policy is read on a phone, in a hurry, from a store listing link. */
.wrap { overflow-x: auto; }
footer { margin-top: 4rem; font-size: .85rem; color: rgba(251,247,239,.5); }
@media (max-width: 480px) { body { font-size: 16px; } main { padding-top: 2rem; } }
</style>
</head>
<body>
<main>
<h1>Loaf Apps</h1>
<p>Small apps, made carefully.</p>
<h2>Naipes</h2>
<p>The card games of the Spanish deck — tute, brisca, chinchón and escoba —
played by your household's rules.</p>
<p><a href="naipes/privacy/">Privacy policy</a> · <a href="naipes/delete/">Deleting your data</a></p>
<h2>Contact</h2>
<p>appsloaf@gmail.com</p>
<footer>appsloaf@gmail.com</footer>
</main>
</body>
</html>
